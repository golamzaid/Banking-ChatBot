<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBot - Professional Banking Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Scrollbar for sleek look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0F19;
        }
        ::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="bg-[#0B0F19] text-gray-100 font-sans h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

    <!-- Header Section -->
    <header class="bg-[#111827]/80 backdrop-blur-md border-b border-gray-800/80 py-4 px-6 text-center shadow-lg sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-center space-x-2">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-lg font-bold tracking-tight text-white">FinBot Assistant</h1>
        </div>
        <p class="text-xs text-gray-400 mt-0.5">100% Secure & Offline Banking Intelligence</p>
    </header>

    <!-- Chat Messages Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 max-w-4xl w-full mx-auto space-y-6 my-2">
        <!-- Initial Bot Greeting -->
        <div class="flex items-start space-x-3">
            <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-xs shrink-0 shadow-inner">AI</div>
            <div class="bg-[#111827] p-4 rounded-2xl rounded-tl-sm border border-gray-800/80 max-w-xl shadow-xl text-sm leading-relaxed">
                <span class="text-xs font-semibold text-blue-400 block mb-1">FinBot</span>
                <p class="text-gray-200">Hello! I'm your smart banking assistant. You can ask me anything about your bank accounts, loans, or services.</p>
            </div>
        </div>
    </div>

    <!-- Input Section -->
    <div class="bg-[#0B0F19]/80 backdrop-blur-md border-t border-gray-800/80 p-4 sm:p-6 shadow-2xl">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-3 items-center">
            <div class="relative flex-1">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Ask anything ... (e.g., What is my credit card limit?)" 
                    class="w-full bg-[#111827] text-gray-100 placeholder-gray-500 border border-gray-800 rounded-2xl px-5 py-4 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition shadow-inner"
                    required
                >
            </div>
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-500 text-white px-7 py-4 rounded-2xl text-sm font-semibold transition duration-200 shadow-lg shadow-blue-600/20 flex items-center justify-center shrink-0 active:scale-95">
                Send
            </button>
        </form>
        <p class="text-[11px] text-center text-gray-500 mt-3">FinBot can make mistakes. Verify important financial details with your bank.</p>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const promptText = userInput.value.trim();
            if (!promptText) return;

            // 1. Append User Message
            appendMessage(promptText, 'user');
            userInput.value = '';
            scrollToBottom();

            // 2. Append Loading Indicator
            const loadingId = 'loading-' + Date.now();
            appendLoading(loadingId);
            scrollToBottom();

            try {
                // 3. Send Request to FastAPI Backend
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (response.ok) {
                    appendBotMessage(data.reply, data.bank, data.category);
                } else {
                    appendMessage('Error: Something went wrong on the server.', 'bot');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Failed to connect to the backend server.', 'bot');
            }
            scrollToBottom();
        });

        function appendMessage(text, sender) {
            if (sender === 'user') {
                chatContainer.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-blue-600 text-white p-4 rounded-2xl rounded-tr-sm max-w-xl shadow-lg text-sm leading-relaxed">
                            <span class="text-xs font-semibold block mb-1 text-blue-200 text-right">You</span>
                            <p>${text}</p>
                        </div>
                    </div>`;
            } else {
                chatContainer.innerHTML += `
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-xs shrink-0 shadow-inner">AI</div>
                        <div class="bg-[#111827] p-4 rounded-2xl rounded-tl-sm border border-gray-800/80 max-w-xl shadow-xl text-sm leading-relaxed">
                            <span class="text-xs font-semibold text-blue-400 block mb-1">FinBot</span>
                            <p class="text-gray-200">${text}</p>
                        </div>
                    </div>`;
            }
        }

        function appendBotMessage(reply, bank, category) {
            let tagsHtml = '';
            if (bank && category) {
                tagsHtml = `
                    <div class="mb-2.5 flex flex-wrap gap-2">
                        <span class="bg-blue-950/80 text-blue-300 border border-blue-800/60 text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider">🏦 ${bank}</span>
                        <span class="bg-emerald-950/80 text-emerald-300 border border-emerald-800/60 text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider">📂 ${category}</span>
                    </div>`;
            }
            chatContainer.innerHTML += `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-xs shrink-0 shadow-inner">AI</div>
                    <div class="bg-[#111827] p-4 rounded-2xl rounded-tl-sm border border-gray-800/80 max-w-xl shadow-xl text-sm leading-relaxed">
                        <span class="text-xs font-semibold text-blue-400 block mb-1">FinBot</span>
                        ${tagsHtml}
                        <p class="text-gray-200">${reply}</p>
                    </div>
                </div>`;
        }

        function appendLoading(id) {
            chatContainer.innerHTML += `
                <div id="${id}" class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-xs shrink-0 shadow-inner">AI</div>
                    <div class="bg-[#111827] p-4 rounded-2xl rounded-tl-sm border border-gray-800/80 shadow-xl text-sm text-gray-400 italic flex items-center space-x-2">
                        <svg class="animate-spin h-4 w-4 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span>Searching knowledge base...</span>
                    </div>
                </div>`;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
